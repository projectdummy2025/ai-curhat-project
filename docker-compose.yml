services:
  postgres:
    image: postgres:16-alpine
    container_name: asmashita-postgres
    environment:
      POSTGRES_USER: asmashita
      POSTGRES_PASSWORD: asmashita
      POSTGRES_DB: asmashita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmashita"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
